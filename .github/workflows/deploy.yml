name: Aggiorna dati e pubblica Treni

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: pianificazione ogni 15 minuti (GitHub non garantisce l'esecuzione puntuale).
    - cron: '3,18,33,48 * * * *'

concurrency:
  group: pages-treni
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Raccogli dati e prepara il sito
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica script
        run: |
          python -m unittest discover -s tests -v
          node --check public/app.js
      - name: Chiave cache stazioni
        run: echo "CATALOG_DAY=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Cache giornaliera delle stazioni
        uses: actions/cache@v4
        with:
          path: _cache/stations.json
          key: stazioni-viaggiatreno-v2-${{ env.CATALOG_DAY }}
      - name: Recupera gli ultimi tabelloni
        run: python scripts/collect.py
      - name: Carica sito per GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Pubblica su GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
